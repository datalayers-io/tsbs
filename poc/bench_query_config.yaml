# Datalayers TSBS POC 查询专用配置（poc/bench.sh 读取）。
# 与 bench_config.yaml 唯一区别：create_db_table=false、gen_data=false、
# load_data=false，即只执行：生成查询(gen_queries) + 跑全部查询(run_queries)。
# 前提：数据已由 bench_load_config.yaml（或全量 bench_config.yaml）灌入。
# 用法：./poc/bench.sh poc/bench_query_config.yaml [smoke]

# Datalayers Arrow Flight SQL 服务地址（tsbs_load 灌数、tsbs_run_queries 查询使用）
flight_addr: localhost:8360

# Datalayers HTTP 服务地址（bench.sh 用它探测服务是否开启）
http_addr: localhost:8361

# dlsql 工具目录（填绝对路径，例如 /opt/datalayers/bin；留空则直接在 PATH 中执行 dlsql）
dlsql_dir: ""

# dldump 工具目录（填绝对路径，例如 /opt/datalayers/bin；留空则直接在 PATH 中执行 dldump）
dldump_dir: /home/nsc/datalayers/target/debug

# 传给 dlsql 的附加参数（例如需要指定默认库时填 "-d default"；留空则不传）
dlsql_extra_args: ""

# dlsql 执行 create.sql 的超时秒数（dlsql 无内置超时，避免服务端 DDL 卡住时脚本无限等待）
dlsql_timeout: 300

# dldump 导出数据的超时秒数（避免大数据量导出时脚本无限等待）
dldump_timeout: 600

# 目标数据库名（建库建表/alter/压缩率计算等 SQL 使用的库）
database: benchmark

# 查询配置不建库建表（数据已灌好）
create_db_table: false

# 查询配置不生成数据（数据已灌好）
gen_data: false

# 为 true 则调用 poc/scripts/gen_queries_poc.sh 生成全部查询，并重写 SQL hint
gen_queries: true

# 查询配置不灌数（数据已灌好）
load_data: false

# 查询配置不创建 rollup（数据/rollup 已由灌数阶段建好）
create_rollup: false

# 为 true 则调用 poc/scripts/run_all_queries_poc.sh 跑全部 15 种查询
run_queries: true

# 查询并发 worker 数（run_all_queries_poc.sh 使用）
query_workers: 8
