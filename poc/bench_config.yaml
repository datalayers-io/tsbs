# Datalayers TSBS POC 一键压测配置（poc/bench.sh 读取）。
# 除 dlsql_dir / dlsql_extra_args 外均为必填；布尔开关 true/false。

# Datalayers Arrow Flight SQL 服务地址（tsbs_load 灌数、tsbs_run_queries 查询使用）
flight_addr: localhost:8360

# Datalayers HTTP 服务地址（bench.sh 用它探测服务是否开启）
http_addr: localhost:8361

# dlsql 工具目录（填绝对路径，例如 /opt/datalayers/bin；留空则直接在 PATH 中执行 dlsql）
dlsql_dir: ""

# 传给 dlsql 的附加参数（例如需要指定默认库时填 "-d default"；留空则不传）
dlsql_extra_args: ""

# 为 true 则用 dlsql --load-file 执行 poc/create.sql 建库建表
create_db_table: true

# 为 true 则调用 poc/scripts/gen_data_poc.sh 生成 fresh + stale 数据
gen_data: true

# 为 true 则调用 poc/scripts/gen_queries_poc.sh 生成全部查询，并重写 SQL hint
gen_queries: true

# 为 true 则调用 poc/scripts/load_data_poc.sh 灌入 fresh + stale 数据
load_data: true

# 为 true 则调用 poc/scripts/run_all_queries_poc.sh 跑全部 15 种查询
run_queries: true

# 查询并发 worker 数（run_all_queries_poc.sh 使用）
query_workers: 8
